name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack mod
        run: unzip -q greyside-mod.zip -d unpacked

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.8

      - name: Build
        run: gradle build --no-daemon
        working-directory: unpacked/greyside-mod

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: greyside-mod
          path: |
            unpacked/greyside-mod/build/libs/*.jar
            !unpacked/greyside-mod/build/libs/*-sources.jar

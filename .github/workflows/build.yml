name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack mod
        run: unzip -q greyside-mod.zip -d unpacked

      - name: Find project dir
        id: proj
        run: |
          f=$(find unpacked -name build.gradle | awk '{print length, $0}' | sort -n | head -n1 | cut -d' ' -f2-)
          if [ -z "$f" ]; then
            echo "build.gradle не найден в архиве. Содержимое:"
            find unpacked -maxdepth 3
            exit 1
          fi
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.8

      - name: Build
        run: gradle build --no-daemon
        working-directory: ${{ steps.proj.outputs.dir }}

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: greyside-mod
          path: |
            ${{ steps.proj.outputs.dir }}/build/libs/*.jar
            !${{ steps.proj.outputs.dir }}/build/libs/*-sources.jar
